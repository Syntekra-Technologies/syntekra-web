<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Apply the saved or system theme before first paint. Keep the key in sync with src/composables/useTheme.ts -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('syntekra-theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>

    <title>Syntekra | Custom Software, AI Automation &amp; System Integration</title>
    <meta
      name="description"
      content="Syntekra designs and builds custom software, AI agents, business process automation and system integrations for companies that need technology to fit the way they operate."
    />
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <meta name="robots" content="index, follow" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#040d20" media="(prefers-color-scheme: dark)" />

    <!--preload-fonts-->

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Syntekra" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta
      property="og:title"
      content="Syntekra | Custom Software, AI Automation & System Integration"
    />
    <meta
      property="og:description"
      content="We design and build custom software, AI agents, process automation and system integrations around the way your business works."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Syntekra logo with the line: Software engineered around the way your business works."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Syntekra | Custom Software, AI Automation & System Integration"
    />
    <meta
      name="twitter:description"
      content="We design and build custom software, AI agents, process automation and system integrations around the way your business works."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Syntekra",
        "url": "%VITE_SITE_URL%/",
        "logo": "%VITE_SITE_URL%/syntekra-icon.png",
        "slogan": "Engineering Tomorrow Together",
        "description": "Custom software development, AI agents and intelligent automation, business process automation, and systems and API integration."
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
